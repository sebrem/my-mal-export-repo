# GitHub Action: Wöchentlicher MAL-Pull per API v2 (jeden Montag)
# Ablageort im Repo: .github/workflows/mal-export.yml
# Cron auf :17 statt :00 - GitHub verwirft/verzoegert Scheduled Runs zu vollen Stunden
# (Peak-Time-Queueing); Off-Peak-Minuten kommen deutlich zuverlaessiger.
#
# Patch 2026-11-11 (Alias-Harvest): fetch_list um alternative_titles{en,ja,synonyms}
# erweitert + make_alias_index.py erzeugt mal_alias_index.json (id->Titelvarianten,
# Belegfall Net-juu no Susume 36038). AniList-Daten im Alias-Index sind ggf.
# einen Zyklus alt (AniList-Export laeuft erst 04:47 UTC).

name: MAL Sync

on:
  schedule:
    # Jeden Montag, 04:17 UTC (bewusst off-peak statt 04:00; s.o.)
    - cron: '17 4 * * 1'
  workflow_dispatch: {}  # manueller Start über den "Run workflow"-Button

permissions:
  contents: write

env:
  MAL_USER: DevOpsElfMage

jobs:
  mal-pull:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: MAL-Listen per API v2 ziehen
        env:
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
        run: |
          set -euo pipefail

          fetch_list() {
            local kind="$1"        # anime | manga
            local extra_fields="$2"
            local url page_data next ndjson
            ndjson="raw_${kind}.ndjson"
            : > "$ndjson"
            url="https://api.myanimelist.net/v2/users/${MAL_USER}/${kind}list?fields=list_status${extra_fields}&nsfw=true&limit=500"

            while [ -n "$url" ]; do
              page_data=$(curl -gsfS --retry 3 --retry-delay 5 \
                -H "X-MAL-CLIENT-ID: ${MAL_CLIENT_ID}" "$url")

              # Pro Eintrag: node-Metadaten + list_status (Score, Status etc.) zusammenführen
              jq -c '.data[] | . as $e | $e.node + {list_status: $e.list_status}' \
                <<<"$page_data" >> "$ndjson"

              url=$(jq -r '.paging.next // empty' <<<"$page_data")
            done

            jq -s --arg user "$MAL_USER" --arg kind "$kind" \
              '{generated_at: (now | todate), source: "MAL API v2", user: $user, kind: $kind, count: length, list: .}' \
              "$ndjson" > "mal_${kind}.json"
            echo "mal_${kind}.json: $(jq '.count' "mal_${kind}.json") Eintraege"
            rm -f "$ndjson"
          }

          fetch_list anime ',num_episodes,alternative_titles{en,ja,synonyms}'
          fetch_list manga ',num_chapters,num_volumes,alternative_titles{en,ja,synonyms}'

      - name: Slim-Indexe erzeugen (MAL, Session-Schutz 02.11.2026)
        run: python3 scripts/make_indexes.py --mal

      - name: Alias-Index erzeugen (id -> Titelvarianten, Patch 2026-11-11)
        run: python3 scripts/make_alias_index.py

      - name: Committen (nur wenn sich etwas geändert hat)
        run: |
          set -euo pipefail
          git config user.name  "mal-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add mal_anime.json mal_manga.json mal_anime_index.json mal_manga_index.json mal_alias_index.json
          if git diff --cached --quiet; then
            echo "Keine Aenderungen seit letztem Pull - kein Commit noetig."
          else
            git commit -m "MAL export $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push || (sleep 20 && git pull --rebase origin main && git push)
          fi
