name: Abo-Katalog-Check
on:
  schedule:
    - cron: "30 3 * * 1"   # montags 03:30 UTC, vor dem MAL-Export-Pull (04:17)
  workflow_dispatch: {}      # manuelles Triggern über den Reiter "Actions" möglich

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        run: pip install requests beautifulsoup4

      - name: Kataloge abgleichen
        run: python scripts/abo_katalog_check.py
        env:
          REPO_ROOT: ${{ github.workspace }}
          # optional: ermöglicht authentifizierte JNC-API-Zugriffe
          # (Repo Settings → Secrets and variables → Actions anlegen)
          JNC_EMAIL: ${{ secrets.JNC_EMAIL }}
          JNC_PASSWORD: ${{ secrets.JNC_PASSWORD }}
          JNC_NINA_EMAIL: ${{ secrets.JNC_NINA_EMAIL }}
          JNC_NINA_PASSWORD: ${{ secrets.JNC_NINA_PASSWORD }}
          # MangaPlaza-Premium-Login (Read-in-Full nur eingeloggt sichtbar)
          MP_EMAIL: ${{ secrets.MP_EMAIL }}
          MP_PASSWORD: ${{ secrets.MP_PASSWORD }}

      - name: Manga-UP!-Katalog abgleichen
        run: python scripts/mangaup_catalog.py
        env:
          REPO_ROOT: ${{ github.workspace }}

      # Manga+-Katalog: Protobuf-API hinter der Vue-SPA; braucht den
      # SESSION-TOKEN-Header (Null-UUID reicht). continue-on-error
      # haelt die Pipeline am Laufen, falls Shueisha die API aendert.
      - name: Manga+-Katalog abgleichen
        run: python scripts/mangaplus_catalog.py
        env:
          REPO_ROOT: ${{ github.workspace }}
        continue-on-error: true

      # AniList-Dump erneuern (~2 min; Quelle fuer die Alias-Lane).
      # Laeuft vor mal_aliases, damit die EN-Titel frisch sind.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: AniList-Dump erneuern
        run: node scripts/anilist_dump.mjs
        continue-on-error: true

      # MAL-Alias-Lane: loest Romaji-Titel zu EN-Titeln auf, Primaer-
      # quelle anilist_dump.json (kein API-Call, laeuft in Sekunden;
      # Jikan nur optional via USE_JIKAN=1 als Fallback) und matcht die
      # offenen Titel aus open_titles.json automatisch gegen alle 4
      # Katalog-Snapshots -> abo_snapshots/open_title_hints.json
      - name: MAL-Aliase + offene Titel matchen
        run: python scripts/mal_aliases.py
        env:
          REPO_ROOT: ${{ github.workspace }}
        continue-on-error: true

      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add abo_snapshots abo_changes.json jnc_watchlist.json anilist_dump.json
          git diff --cached --quiet || git commit -m "Abo-Katalog-Check: Snapshot + Changes $(date -u +%F)"
          git push
