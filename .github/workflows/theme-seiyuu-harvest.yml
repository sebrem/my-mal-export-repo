name: Seiyuu & Themes Harvest

on:
  schedule:
    # monatlich, 1. des Monats 05:03 UTC (off-peak, nach Jitter-Erfahrung)
    - cron: "3 5 1 * *"
  workflow_dispatch: {}    # manuelles Triggern im Actions-Tab moeglich

permissions:
  contents: write

concurrency:
  group: theme-seiyuu-harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (MAL-Exporte lesen)
        uses: actions/checkout@v7

      - name: Node setup
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Seiyuu & Themes Harvest erzeugen
        env:
          ANILIST_TOKEN: ${{ secrets.ANILIST_TOKEN }}
        run: node scripts/theme_seiyuu_harvest.mjs

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add anime_themes_seiyuu.json
          git diff --cached --quiet || git commit -m "chore: monthly seiyuu & themes harvest ($(date -u +%F))"
          git push
