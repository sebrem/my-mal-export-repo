name: Staff Harvest (Autoren, Regie, Design, Studios)

on:
  schedule:
    # monatlich, 1. des Monats 05:07 UTC (nach Seiyuu-Harvest 05:03, off-peak)
    - cron: "7 5 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: staff-harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (MAL-Exporte lesen)
        uses: actions/checkout@v7

      - name: Node setup
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Staff Harvest erzeugen
        env:
          ANILIST_TOKEN: ${{ secrets.ANILIST_TOKEN }}
        run: node scripts/staff_harvest.mjs

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add staff_harvest.json
          git diff --cached --quiet || git commit -m "chore: monthly staff harvest ($(date -u +%F))"
          git pull --rebase origin main
          git push || (sleep 20 && git pull --rebase origin main && git push)
