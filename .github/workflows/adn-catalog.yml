name: ADN Katalog Harvest

# Wöchentlicher Dump des kompletten ADN-Anime-Katalogs (animationdigitalnetwork.com/de/video)
# als adn_catalog.json (FR-Gesamtkatalog, Erstlauf 29.10.2026: 596 Titel) +
# adn_catalog_de.json (DE-Filter auf distributions 'de') + adn_catalog_status.json (Diagnose).
# Hintergrund: ADN blockt den Mistral-Proxy (403, Anti-Bot-Heuristik), GitHub-Runner
# kommen durch (gleiche Route wie ADN-News-Feed und streaming_rollcheck ADN-Show-Check).
# ERSTLAUF-BEFUND (29.10.2026): Der Runner wird per Geo-Redirect auf die FR-Site
# umgeleitet (/de/video -> /video, total=596 statt 268, Sprachcodes vostf/vf).
# Der FR-Katalog ist ein Superset; DE-Katalog = Filter auf distributions 'de'.
# Sprach-/Genre-Codes in den Katalogdateien sind FR-Sicht (vostf/vf) – DE-Sicht
# (vostde/vde) liefert der Show-Seiten-Check im streaming_rollcheck.
# Nutzen: Streaming-Monitoring firsthand (unabhaengig von JustWatch-Offers), MAL-Abgleich
# Montag kann gegen adn_catalog_de.json laufen.
# Wenn ADN auch die GitHub-Runner blockt (Status blocked), Route ist tot – dann die Action löschen.

on:
  schedule:
    - cron: "40 5 * * 1"  # montags 05:40 UTC (07:40 MESZ), vor dem MAL-Abgleich
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: adn-catalog
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: ADN-Katalog abholen und JSON bauen
        run: node scripts/adn_catalog_fetch.mjs

      - name: Ergebnisse committen
        run: |
          git config user.name "adn-catalog-bot"
          git config user.email "actions@github.com"
          git add adn_catalog.json adn_catalog_de.json adn_catalog_status.json
          if git diff --cached --quiet; then
            echo "Keine Aenderungen - kein Commit noetig."
          else
            git commit -m "chore: adn catalog harvest $(date -u +%F)"
            git pull --rebase origin main
            git push || (sleep 20 && git pull --rebase origin main && git push)
          fi
