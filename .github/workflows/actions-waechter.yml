name: Actions-Waechter

# Taeglicher Watchdog: prueft, ob alle geplanten Workflows seit ihrem
# jeweils letzten erwarteten Cron-Termin erfolgreich gelaufen sind.
# - GitHub benachrichtigt bei scheduled Workflows NICHT zuverlaessig
#   (fehlgeschlagene oder verworfene Cron-Laeufe bleiben sonst unentdeckt).
# - Bei Problemen: GitHub-Issue mit Label "actions-waechter" (Dedup: offenes
#   Watchdog-Issue wird aktualisiert statt neu angelegt; bei Erholung
#   automatisch geschlossen -> E-Mail-Notification an Sebastian).
# - Schreibt actions_status.json (Heartbeat + Pruefergebnis je Workflow).
#   Der taegliche Commit ist gewollt: er dokumentiert, dass der Waechter
#   selbst gelaufen ist (und verhindert GitHub's 60-Tage-Cron-Abschaltung).
# - Laufzeit 12:23 UTC: deutlich nach der spaetesten geplanten Action des
#   Tages (Verlags-Announcements 05:47 UTC) inkl. Schedule-Jitter-Puffer.
#   Off-Peak-Minute statt :00/:30 (gleiche Regel wie die anderen Workflows).

on:
  schedule:
    - cron: "23 12 * * *"
  workflow_dispatch: {}   # manueller Trigger moeglich (Erst-Lauf / Ad-hoc-Check)

permissions:
  actions: read           # Workflow-Runs lesen
  issues: write           # Watchdog-Issues anlegen/schliessen
  contents: write         # actions_status.json committen

concurrency:
  group: actions-waechter
  cancel-in-progress: false

jobs:
  waechter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Waechter-Check ausfuehren
        run: python scripts/actions_waechter.py
        env:
          WAECHTER_REPO: ${{ github.repository }}
          WAECHTER_TOKEN: ${{ github.token }}

      - name: Status committen (Heartbeat)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add actions_status.json
          git diff --cached --quiet || (git commit -m "Actions-Waechter: Status $(date -u +%F)" && git push)
